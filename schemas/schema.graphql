type Office @table(database: "roster") @export {
	id: ID @primaryKey # e.g. "office-a"
	name: String!
	publicKey: String! # Ed25519 hex (32 bytes) — NOT public-safe; excluded from public reads
	status: String @indexed # "online" | "offline" | "degraded"
	lastSeen: String
	agentCount: Int
	staleThresholdSeconds: Int # default 600 (2x a 5-min cron); renderers compute staleness uniformly
	createdAt: String!
	updatedAt: String
}

type Member @table(database: "roster") @export {
	id: ID @primaryKey # "{officeId}:{agentId}"
	officeId: String! @indexed
	agentId: String! @indexed
	name: String
	role: String
	type: String # "agent" | "human"
	model: String
	status: String @indexed # "active" | "idle" | "offline" | "stale"  (stale = heartbeat-missed/crashed, vs deliberate offline)
	activity: String @indexed # "coding" | "reviewing" | "planning" | "idle" — drives renderer room assignment
	currentTask: String
	lastActivity: String
	lastHeartbeat: String
	updatedAt: String!
}

type Event @table(database: "roster") @export {
	id: ID @primaryKey # "{officeId}:{eventId}"
	officeId: String! @indexed
	kind: String! @indexed
	authorId: String! @indexed
	summary: String!
	refId: String @indexed
	scope: String @indexed
	targetIds: [String] # recipients/subjects — e.g. mail→to, security_flag→subject
	createdAt: String! @indexed
	receivedAt: String!
	expiresAt: String @indexed
}
